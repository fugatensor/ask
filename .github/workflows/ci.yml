name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native C++ / CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ cmake ninja-build zlib1g-dev libxml2-dev
      - name: Check dependency tooling
        run: python3 -m unittest discover -s tests -p test_tooling.py -v
      - name: Cache the locked LLVM archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/*.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ hashFiles('cmake/llvm.lock.json') }}
      - name: Fetch and verify LLVM
        run: python3 tools/fetch_deps.py
      - name: Configure and build
        run: |
          cmake --preset core
          cmake --build --preset core
      - name: Run native CPU suites
        run: python3 tools/run_ci_tests.py --build-dir build/core
      - name: Install and consume the native SDK
        run: |
          sdk="$(python3 -c 'import json, pathlib; print((pathlib.Path(".deps") / json.load(open("cmake/llvm.lock.json"))["directory"]).resolve())')"
          cmake --install build/core --prefix "$RUNNER_TEMP/ask-install"
          cmake -S examples/cpp -B "$RUNNER_TEMP/ask-core-consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ask-install;$sdk"
          cmake --build "$RUNNER_TEMP/ask-core-consumer"
          "$RUNNER_TEMP/ask-core-consumer/ask-frontend-example" --optimize
          cmake -S examples/cpp -B "$RUNNER_TEMP/ask-compiler-consumer" -G Ninja \
            -DASK_EXAMPLE_CORE=OFF -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ask-install" \
            -DCMAKE_DISABLE_FIND_PACKAGE_LLVM=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_MLIR=TRUE
          cmake --build "$RUNNER_TEMP/ask-compiler-consumer"
          "$RUNNER_TEMP/ask-compiler-consumer/ask-compiler-example" "$RUNNER_TEMP/native.o"
          cmake -S examples/cpp-runtime -B "$RUNNER_TEMP/ask-runtime-consumer" -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ask-install" \
            -DCMAKE_DISABLE_FIND_PACKAGE_LLVM=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_MLIR=TRUE
          cmake --build "$RUNNER_TEMP/ask-runtime-consumer"
      - name: Keep native test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ask-native-tests
          path: |
            build/core/ci-tests.xml
            build/core/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
