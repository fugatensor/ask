[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-compiler"
version = "0.1.0"
description = "Standard-library Python client for the ASK MLIR compiler"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
